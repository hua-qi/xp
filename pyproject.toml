[project]
name = "xp"
version = "0.2.0"
description = "Agent 最佳实践沉淀工具 - 纯文本标签 + BM25 检索"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0.0",
]

[project.scripts]
xp = "src.cli:main"
xp-server = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
