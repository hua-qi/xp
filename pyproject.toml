[project]
name = "xp-agent"
version = "0.3.0"
description = "团队 Agent 最佳实践沉淀工具，CS 架构 + MySQL，支持 MCP Streamable HTTP 接入"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "agent", "knowledge-base", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.24.0",
    "aiomysql>=0.2.0",
    "PyMySQL>=1.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=1.3.0",
    "openai>=1.0.0",
    "apscheduler>=3.10.0",
]

[project.scripts]
xp-server = "src.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
