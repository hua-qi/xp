name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install pytest-asyncio pytest-cov
        
    - name: Run tests (no server, no postgres)
      run: |
        pytest tests/ -v -k "not server and not postgres"
        
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install ruff
      run: pip install ruff
    - name: Lint with Ruff
      run: |
        ruff check src/ tests/
        # 暂时忽略导入排序等风格错误，主要检查致命错误
        ruff check src/ tests/ --output-format=github --select=E9,F63,F7,F82
